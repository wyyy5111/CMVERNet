[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmvernet-core"
version = "0.1.0"
description = "Core implementation of CMVERNet for speech emotion recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "torch>=2.0", "tqdm>=4.66"]

[project.optional-dependencies]
audio = ["librosa>=0.10", "soundfile>=0.12", "opensmile>=2.6", "noisereduce>=3", "transformers>=4.40", "huggingface-hub>=0.23"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["cmvernet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
